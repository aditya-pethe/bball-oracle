# Season coverage config for the ETL pipeline.
#
# Adding a season, or turning on playoffs for one already listed, is a config change
# here plus a rerun of `python -m pipeline.cli load` — no code changes needed.
#
# `year` is the 4-digit season-start year in nba_data's own archive naming
# (2023 -> the 2023-24 season, matching nbastats_2023.tar.xz / nbastats_po_2023.tar.xz).
#
# Matches what's actually loaded in the live Supabase project: 2023-24 regular season only,
# on free tier (project_plan.md §3/§10). One regular season measured at 216MB for
# pbp_event + shot_detail combined -- adding playoffs or more seasons here without first
# upgrading the Supabase plan will blow past the free-tier 500MB cap. Expand this list only
# after that upgrade.

seasons:
  - year: 2023
    season_types: [regular]
